<!doctype html>
<html>
  <head>
    <title>My First Website</title>
    <link rel="stylesheet" href="styles.css" />

    <!-- Load D3.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

    <!-- Bar chart styling -->
    <style>
      #chart {
        width: 100%;
        max-width: 700px;
      }

      .bar {
        fill: #3b82f6;
        transition: fill 0.2s;
      }

      .bar:hover {
        fill: #1d4ed8;
      }

      .axis text {
        font-size: 12px;
        fill: #475569;
      }

      .axis path,
      .axis line {
        stroke: #cbd5e1;
      }

      .value-label {
        font-size: 12px;
        fill: #1e293b;
        text-anchor: middle;
      }
    </style>
  </head>

  <body>
    <h1>Hello World!</h1>

    <p>
      This is my very first website. And this is my second sentence for Github
    </p>

    <p>
      <a href="https://github.com/Hanahmay2/first-website">
        View source on GitHub
      </a>
    </p>

    <!-- NEW: Bar chart -->
    <h2>My First Bar Chart</h2>
    <div id="chart"></div>

    <script>
      const data = [
        { name: "A", value: 1 },
        { name: "B", value: 5 },
        { name: "C", value: 8 },
        { name: "D", value: 10 },
      ];

      const margin = {
        top: 30,
        right: 20,
        bottom: 45,
        left: 45,
      };

      const width = 650;
      const height = 380;

      const innerWidth = width - margin.left - margin.right;
      const innerHeight = height - margin.top - margin.bottom;

      // Create the SVG canvas
      const svg = d3
        .select("#chart")
        .append("svg")
        .attr("viewBox", `0 0 ${width} ${height}`)
        .attr("width", "100%")
        .attr("role", "img")
        .attr("aria-label", "Bar chart showing A: 1, B: 5, C: 8, D: 10");

      const g = svg
        .append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);

      // X-axis scale
      const x = d3
        .scaleBand()
        .domain(data.map((d) => d.name))
        .range([0, innerWidth])
        .padding(0.25);

      // Y-axis scale
      const y = d3
        .scaleLinear()
        .domain([0, d3.max(data, (d) => d.value) * 1.15])
        .nice()
        .range([innerHeight, 0]);

      // Add horizontal grid lines
      g.append("g")
        .call(d3.axisLeft(y).tickSize(-innerWidth).tickFormat(""))
        .call((axis) => axis.select(".domain").remove())
        .call((axis) =>
          axis
            .selectAll("line")
            .attr("stroke", "#e2e8f0")
            .attr("stroke-dasharray", "3,3"),
        );

      // Add the X axis
      g.append("g")
        .attr("class", "axis")
        .attr("transform", `translate(0,${innerHeight})`)
        .call(d3.axisBottom(x));

      // Add the Y axis
      g.append("g").attr("class", "axis").call(d3.axisLeft(y).ticks(5));

      // Draw the bars
      g.selectAll(".bar")
        .data(data)
        .join("rect")
        .attr("class", "bar")
        .attr("x", (d) => x(d.name))
        .attr("y", (d) => y(d.value))
        .attr("width", x.bandwidth())
        .attr("height", (d) => innerHeight - y(d.value))
        .attr("rx", 4);

      // Add value labels above each bar
      g.selectAll(".value-label")
        .data(data)
        .join("text")
        .attr("class", "value-label")
        .attr("x", (d) => x(d.name) + x.bandwidth() / 2)
        .attr("y", (d) => y(d.value) - 8)
        .text((d) => d.value);

      // Add the Y-axis label
      svg
        .append("text")
        .attr("transform", "rotate(-90)")
        .attr("x", -(margin.top + innerHeight / 2))
        .attr("y", 15)
        .attr("text-anchor", "middle")
        .attr("fill", "#475569")
        .attr("font-size", 12)
        .text("Value");
    </script>
    <!-- END: Bar chart -->
  </body>
</html>
